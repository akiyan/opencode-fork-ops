name: Build fork
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read pinned source
        id: source
        run: |
          python3 - <<'PY'
          import json, os
          lock = json.load(open('config/source.lock.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print('commit=' + lock['fork_commit'], file=out)
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: akiyan/opencode
          ref: ${{ steps.source.outputs.commit }}
          path: source
          fetch-depth: 2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Validate and build
        env:
          SOURCE_DIR: ${{ github.workspace }}/source
        run: |
          ./scripts/verify.sh
          cd source
          bun install --frozen-lockfile
          bun run check
          (cd packages/core && bun test test/session-stats.test.ts test/vcs.test.ts)
          (cd packages/server && bun test test/session-update.test.ts)
          (cd packages/client && bun test --conditions=browser test/solid-data.test.ts --test-name-pattern 'preserves sibling catalogs')
          cd packages/app
          bun x playwright install --with-deps chromium
          PLAYWRIGHT_BUILD=1 bun x playwright test e2e/regression/composer.spec.ts --project chromium --grep 'composer shows session totals|new session shows centered' --workers=1 --reporter=line
          cd ../..
          cd ..
          ./scripts/build.sh
